<g fill="#000" text-anchor="middle">
<g font-style="italic">
<text x="22" y="30" text-anchor="start">Аппаратный клиент (микроконтроллеры, Wi-Fi 2,4 ГГц)</text>
<text x="22" y="460" text-anchor="start">Сервер (Python, Flask REST API)</text>
</g>
<text x="115" y="83">Ультразвуковой датчик</text><text x="115" y="101">HC-SR04</text>
<text x="115" y="158">Лазерный датчик</text><text x="115" y="176">VL53L0X (I2C)</text>
<text x="350" y="98">ESP32 DevKit V1</text><text x="350" y="116">(ESP32-WROOM-32)</text>
<text x="350" y="145">Главный контроллер:</text><text x="350" y="163">опрос датчиков,</text><text x="350" y="181">запрос кадра,</text><text x="350" y="199">обмен с сервером,</text><text x="350" y="217">вывод результата</text>
<text x="585" y="83">TFT-дисплей</text><text x="585" y="101">ILI9341, 240×320</text>
<text x="585" y="158">Светодиоды</text><text x="585" y="176">красный и зелёный</text>
<text x="115" y="315">ESP32-CAM</text><text x="115" y="333">камера OV2640</text><text x="115" y="351">(HTTP-сервер кадров)</text>
<g font-size="11">
<text x="240" y="82">TRIG/ECHO</text>
<text x="240" y="157">I2C</text>
<text x="460" y="82">SPI</text>
<text x="460" y="157">GPIO</text>
<text x="115" y="278">кадр JPEG по Wi-Fi (HTTP)</text>
<text x="312" y="340" text-anchor="end">HTTP POST</text>
<text x="312" y="354" text-anchor="end">изображение JPEG</text>
<text x="388" y="340" text-anchor="start">JSON-ответ</text>
<text x="388" y="354" text-anchor="start">(классы + текст)</text>
</g>
<text x="350" y="502">REST API (Flask)</text>
<text x="580" y="494">Веб-приложение</text><text x="580" y="511">(просмотр результата)</text>
