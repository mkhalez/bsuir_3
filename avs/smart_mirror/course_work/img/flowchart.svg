</g>
<g fill="#000" text-anchor="middle">
<text x="230" y="33">Начало</text>
<text x="230" y="98">Инициализация GPIO, I2C, SPI, дисплея;</text><text x="230" y="115">подключение к Wi-Fi</text>
<text x="230" y="178">Измерение расстояния</text><text x="230" y="195">датчиками HC-SR04 и VL53L0X</text>
<text x="230" y="278">Пользователь на</text><text x="230" y="294">дистанции 30–60 см</text><text x="230" y="310">дольше 1 с?</text>
<text x="230" y="398">Запрос кадра у ESP32-CAM</text><text x="230" y="415">(HTTP GET /capture)</text>
<text x="230" y="491">Кадр</text><text x="230" y="507">получен?</text>
<text x="230" y="588">Отправка JPEG на сервер</text><text x="230" y="605">(HTTP POST, тайм-аут)</text>
<text x="230" y="682">Ответ</text><text x="230" y="698">получен?</text>
<text x="230" y="778">Разбор JSON, вывод результата</text><text x="230" y="795">на дисплей, зелёный светодиод</text>
<text x="230" y="868">Ожидание ухода пользователя</text>
<text x="570" y="584">Красный светодиод,</text><text x="570" y="601">сообщение об ошибке,</text><text x="570" y="618">пауза, переподключение Wi-Fi</text>
<g font-size="12">
<text x="240" y="356" text-anchor="start">да</text>
<text x="240" y="552" text-anchor="start">да</text>
<text x="240" y="742" text-anchor="start">да</text>
<text x="75" y="280" text-anchor="end">нет</text>
<text x="460" y="490">нет</text>
<text x="460" y="680">нет</text>
</g>
</g>
</svg>
