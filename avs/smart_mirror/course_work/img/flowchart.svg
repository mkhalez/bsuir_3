<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 920" font-family="Times New Roman, Liberation Serif, serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
</defs>
<rect width="700" height="920" fill="#fff"/>
<g fill="none" stroke="#000" stroke-width="1.2">
<!-- terminator -->
<rect x="150" y="10" width="160" height="36" rx="18"/>
<!-- processes -->
<rect x="80" y="76" width="300" height="50"/>
<rect x="80" y="156" width="300" height="50"/>
<rect x="80" y="376" width="300" height="50"/>
<rect x="80" y="566" width="300" height="50"/>
<rect x="80" y="756" width="300" height="60"/>
<rect x="80" y="846" width="300" height="50"/>
<rect x="470" y="556" width="200" height="90"/>
<!-- decisions -->
<path d="M230,236 L350,286 L230,336 L110,286 Z"/>
<path d="M230,456 L350,496 L230,536 L110,496 Z"/>
<path d="M230,646 L350,686 L230,726 L110,686 Z"/>
<!-- arrows -->
<g marker-end="url(#a)">
<path d="M230,46 V76"/>
<path d="M230,126 V156"/>
<path d="M230,206 V236"/>
<path d="M230,336 V376"/>
<path d="M230,426 V456"/>
<path d="M230,536 V566"/>
<path d="M230,616 V646"/>
<path d="M230,726 V756"/>
<path d="M230,816 V846"/>
<!-- loop: wait user -> measurement -->
<path d="M80,871 H40 V181 H80"/>
<!-- D1 no -> measurement -->
<path d="M110,286 H40"/>
<!-- D2 no -> error -->
<path d="M350,496 H570 V556"/>
<!-- D3 no -> error -->
<path d="M350,686 H570 V646"/>
<!-- error -> measurement -->
<path d="M670,601 H685 V181 H380"/>
